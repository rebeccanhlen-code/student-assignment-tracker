<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Assignment</title>
</head>
<body>
    <h1>Add New Assignment</h1>

    <form method="POST" action="/assignments/new">
        <div>
            <label for="title">Title</label><br>
            <input type="text" id="title" name="title" value="{{ form.get('title', '') }}">
            {% if errors.title %}<span style="color:red;">{{ errors.title }}</span>{% endif %}
        </div>
        <div>
            <label for="due_date">Due Date</label><br>
            <input type="text" id="due_date" name="due_date" placeholder="MM-DD-YYYY" maxlength="10" value="{{ form.get('due_date', '') }}">
            {% if errors.due_date %}<span style="color:red;">{{ errors.due_date }}</span>{% endif %}
        </div>
        <div>
            <label for="subject">Subject</label><br>
            <input type="text" id="subject" name="subject" value="{{ form.get('subject', '') }}">
            {% if errors.subject %}<span style="color:red;">{{ errors.subject }}</span>{% endif %}
        </div>
        <div>
            <label for="notes">Notes (optional)</label><br>
            <textarea id="notes" name="notes">{{ form.get('notes', '') }}</textarea>
        </div>
        <div>
            <label for="links">Link (optional)</label><br>
            <input type="text" id="links" name="links" placeholder="https://..." value="{{ form.get('links', '') }}">
        </div>
        <br>
        <button type="submit">Add Assignment</button>
    </form>

    <br>
    <a href="/">Back to assignments</a>

    <script>
        const dateInput = document.getElementById('due_date');
        dateInput.addEventListener('input', function () {
            let digits = this.value.replace(/\D/g, '').slice(0, 8);
            if (digits.length >= 5) {
                this.value = digits.slice(0,2) + '-' + digits.slice(2,4) + '-' + digits.slice(4);
            } else if (digits.length >= 3) {
                this.value = digits.slice(0,2) + '-' + digits.slice(2);
            } else {
                this.value = digits;
            }
        });
    </script>
</body>
</html>
